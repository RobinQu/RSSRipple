# Midscene batch run configuration for RSSRipple E2E tests.
#
# Run from THIS directory so the CLI picks up ./.env (model credentials):
#   cd tests/midscene
#   npx @midscene/cli@latest --config midscene-config.yaml
#
# Prerequisites:
#   - RSSRipple running at ${RSSRIPPLE_URL:-http://localhost:9001}
#   - outbound network access for the live RSS feed used by channel suites
#   - model configured in ./.env (see .env.example)

files:
  - ./dashboard.yaml
  - ./settings.yaml
  - ./channels-lifecycle.yaml
  - ./downloaders-lifecycle.yaml
  - ./agents-lifecycle.yaml
  - ./resources-metadata.yaml
  - ./works-repository.yaml

# Run scripts sequentially; suites are self-contained (each creates and cleans
# up its own entities), but sequential runs keep the server load predictable.
concurrent: 1
continueOnError: true
retry: 1
