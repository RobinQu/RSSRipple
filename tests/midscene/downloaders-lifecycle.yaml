# RSSRipple Downloader Lifecycle — Full CRUD + operations
# Covers: create downloader, test connection, view detail, edit, delete.
# Uses the built-in Mock downloader type so the suite is deterministic and does
# NOT require a running Transmission instance.

web:
  url: ${RSSRIPPLE_URL:-http://localhost:9001}

agent:
  testId: downloader-lifecycle
  groupName: RSSRipple E2E
  groupDescription: Complete downloader instance management lifecycle

tasks:
  - name: Switch UI language to English
    flow:
      - ai: Click the "语言" (Language) dropdown at the very bottom of the left sidebar
      - sleep: 500
      - ai: Select "English" from the language dropdown options
      - aiWaitFor: The left sidebar menu shows English labels such as "Dashboard" and "Downloaders"
        timeout: 10000

  # ── Create Downloader ───────────────────────────────────────────
  - name: Open new downloader form
    flow:
      - ai: Click "Downloaders" in the left sidebar
      - aiWaitFor: The Downloaders page loads with a table of downloader instances
        timeout: 10000
      - ai: Click the "Add Downloader" primary button at the top right
      - aiWaitFor: The "Add Downloader" form loads with a "Downloader Type" selector and a "Name" field
        timeout: 10000

  - name: Select Mock downloader type
    flow:
      - ai: Click the "Downloader Type" selector
      - sleep: 500
      - ai: Select the "Mock (for testing)" option from the dropdown
      - sleep: 500
      - aiAssert: An info alert explains that the Mock downloader does not really download any files

  - name: Fill downloader name and submit
    flow:
      - aiInput: The "Name" input field
        value: Test Mock Downloader
      - sleep: 500
      - ai: Click the "Add Downloader" primary submit button at the bottom of the form
      - aiWaitFor: The downloader detail page loads for "Test Mock Downloader" (a toast says the downloader was saved)
        timeout: 15000

  # ── View Downloader Detail ──────────────────────────────────────
  - name: Verify downloader detail content
    flow:
      - aiAssert: The detail page shows the name "Test Mock Downloader", a descriptions card with URL / Default Download Directory / Status / Last Check, and sections for torrents and local task records
      - aiAssert: The "Local Task Records" section shows a table or an empty state

  - name: Test connection
    flow:
      - ai: Click the "Test Connection" button on the downloader detail page
      - aiWaitFor: A toast or status message shows the connection test result (success for a Mock downloader)
        timeout: 20000

  # ── Edit Downloader ─────────────────────────────────────────────
  - name: Navigate to edit downloader
    flow:
      - ai: Click the "Edit" button on the downloader detail page
      - aiWaitFor: The "Edit Downloader" form loads with the name pre-filled as "Test Mock Downloader" and the Downloader Type selector disabled
        timeout: 10000

  - name: Update downloader name
    flow:
      - ai: Clear the Name input field
      - aiInput: The "Name" input field
        value: Test Mock Downloader Updated
      - sleep: 500
      - ai: Click the "Save Changes" primary button
      - aiWaitFor: The downloader detail page shows "Test Mock Downloader Updated"
        timeout: 15000

  # ── Delete Downloader ───────────────────────────────────────────
  - name: Delete the test downloader
    flow:
      - ai: Click "Downloaders" in the left sidebar
      - aiWaitFor: The downloaders table is visible with the "Test Mock Downloader Updated" row
        timeout: 10000
      - ai: In the "Test Mock Downloader Updated" row, click the delete icon button in the Actions column (tooltip "Delete")
      - sleep: 1000
      - ai: In the confirmation dialog titled "Delete this downloader?", click the danger "Delete" button
      - aiWaitFor: The downloaders table no longer contains "Test Mock Downloader Updated"
        timeout: 15000
