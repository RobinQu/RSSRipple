# RSSRipple Agent Lifecycle — Full CRUD + tabs (works, tasks, decisions, filters, run)
# Self-contained: creates its own Mock downloader and channel as prerequisites,
# because the channel/downloader lifecycle suites clean up after themselves.
# No LLM keys required: the agent form's rules-preview / backfill modal is handled
# via "Save without backfill" whenever it appears.

web:
  url: ${RSSRIPPLE_URL:-http://localhost:9001}

agent:
  testId: agent-lifecycle
  groupName: RSSRipple E2E
  groupDescription: Complete agent management lifecycle including filters, tasks, decisions and runs

tasks:
  - name: Switch UI language to English
    flow:
      - ai: Click the "语言" (Language) dropdown at the very bottom of the left sidebar
      - sleep: 500
      - ai: Select "English" from the language dropdown options
      - aiWaitFor: The left sidebar menu shows English labels such as "Dashboard" and "Download Agents"
        timeout: 10000

  # ── Prerequisite: Mock downloader ────────────────────────────────
  - name: Create prerequisite Mock downloader
    flow:
      - ai: Click "Downloaders" in the left sidebar
      - aiWaitFor: The Downloaders page loads
        timeout: 10000
      - ai: Click the "Add Downloader" primary button
      - aiWaitFor: The "Add Downloader" form loads
        timeout: 10000
      - ai: Click the "Downloader Type" selector
      - sleep: 500
      - ai: Select the "Mock (for testing)" option from the dropdown
      - aiInput: The "Name" input field
        value: Agent Test Downloader
      - ai: Click the "Add Downloader" primary submit button
      - aiWaitFor: The downloader detail page for "Agent Test Downloader" loads
        timeout: 15000

  # ── Prerequisite: channel ────────────────────────────────────────
  - name: Create prerequisite channel
    flow:
      - ai: Click "Channels" in the left sidebar
      - aiWaitFor: The Channels page loads
        timeout: 10000
      - ai: Click the "New Channel" primary button
      - aiWaitFor: The "New Channel" form loads
        timeout: 10000
      - aiInput: The "Name" input field in the channel form
        value: Agent Test Channel
      - aiInput: The "RSS URL" input field
        value: ${RSSRIPPLE_TEST_FEED_URL:-https://rss.art19.com/apology-line}
      - ai: Click the "Validate" button attached to the RSS URL field
      - aiWaitFor: A green "Valid RSS" validation result appears below the RSS URL field
        timeout: 30000
      - ai: Click the "Create Channel" primary submit button
      - aiWaitFor: The Channels list page shows a row named "Agent Test Channel"
        timeout: 15000

  # ── Create Agent ────────────────────────────────────────────────
  - name: Open new agent form
    flow:
      - ai: Click "Download Agents" in the left sidebar
      - aiWaitFor: The agents page loads with a table of agents
        timeout: 10000
      - ai: Click the "New Agent" primary button at the top right
      - aiWaitFor: The "New Agent" form loads with fields for Name, Channel, Downloader and other settings
        timeout: 10000

  - name: Fill agent name
    flow:
      - aiInput: The "Name" input field in the agent form
        value: Test Anime Agent
      - sleep: 500

  - name: Select channel
    flow:
      - ai: Click the "Channel" select dropdown
      - sleep: 500
      - ai: Select the "Agent Test Channel" option from the dropdown list
      - sleep: 500

  - name: Select downloader
    flow:
      - ai: Click the "Downloader" select dropdown
      - sleep: 500
      - ai: Select the "Agent Test Downloader" option from the dropdown list
      - sleep: 500

  - name: Set download subdirectory
    flow:
      - aiInput: The "Download Subdirectory" input field
        value: Anime/Test
      - sleep: 300

  - name: Configure conflict handling and scope
    flow:
      - ai: In the "Conflict" radio group, choose the "Ask" option
      - sleep: 300
      - ai: Make sure the "Subscription Scope" switch is turned ON so the scope is channel-wide (the checked state is labeled "Channel-wide")
      - sleep: 300

  - name: Add a global filter condition
    flow:
      - ai: In the "Global Filter Conditions" section, click the "Add Condition" button
      - sleep: 500
      - ai: In the new condition row, open the field selector and choose the "resolution" field
      - sleep: 300
      - ai: In the same condition row, open the operator selector and choose the "in (multi-value)" operator ("属于 (多值)")
      - sleep: 300
      - ai: In the same condition row, set the value to include "1080p"
      - sleep: 500

  - name: Save the agent (handle backfill modal)
    flow:
      - ai: Click the "Create Agent" primary submit button at the bottom of the form
      - sleep: 5000
      - ai: If a modal titled "Newly matching resources" (新增匹配的资源) appears, click its "Save without backfill" (仅保存规则（不加入）) button
      - aiWaitFor: The agent detail page for "Test Anime Agent" loads (URL contains /agents/), with tabs such as "Subscribed Works", "Download Tasks", "Pending Decisions", "Filter" and "Run Control"
        timeout: 20000

  # ── Agent Detail — Works Tab ────────────────────────────────────
  - name: View Subscribed Works tab
    flow:
      - ai: Click the "Subscribed Works" tab
      - sleep: 2000
      - aiAssert: The works tab is visible; with channel-wide scope it shows no per-work subscription requirement and a read-only view of global filters

  # ── Agent Detail — Tasks Tab ────────────────────────────────────
  - name: View Download Tasks tab
    flow:
      - ai: Click the "Download Tasks" tab
      - aiWaitFor: The tasks tab shows a "Status filter" selector and a table with columns Title, Status, Progress, Error, Actions, or an empty state saying there are no tasks
        timeout: 10000

  # ── Agent Detail — Decisions Tab ────────────────────────────────
  - name: View Pending Decisions tab
    flow:
      - ai: Click the "Pending Decisions" tab
      - aiWaitFor: The decisions tab shows pending decision cards with candidate Confirm/Skip actions, or an empty state
        timeout: 10000

  # ── Agent Detail — Filter Tab ───────────────────────────────────
  - name: View Filter tab and test filters
    flow:
      - ai: Click the "Filter" tab
      - aiWaitFor: The filter editor shows the previously configured condition (resolution in 1080p)
        timeout: 10000
      - ai: Click the "Test" button next to the filter editor
      - aiWaitFor: A "Test Results" card appears with statistics such as Total Resources / Passed / Failed
        timeout: 20000

  # ── Agent Detail — Run Control Tab ──────────────────────────────
  - name: Trigger manual agent run
    flow:
      - ai: Click the "Run Control" tab
      - aiWaitFor: The run control tab shows a "Run Now" primary button
        timeout: 10000
      - ai: Click the "Run Now" button
      - aiWaitFor: A run status line appears (queued / processing / finished) and eventually a row is added to the "Run history" table, or a message explains the run state
        timeout: 60000

  # ── Delete agent and prerequisites ──────────────────────────────
  - name: Delete the test agent
    flow:
      - ai: Click "Download Agents" in the left sidebar
      - aiWaitFor: The agents table is visible with the "Test Anime Agent" row
        timeout: 10000
      - ai: In the "Test Anime Agent" row, click the delete icon button in the Actions column (tooltip "Delete")
      - sleep: 1000
      - ai: In the confirmation dialog, click the danger "Delete" button
      - aiWaitFor: The agents table no longer contains "Test Anime Agent"
        timeout: 15000

  - name: Delete the prerequisite channel
    flow:
      - ai: Click "Channels" in the left sidebar
      - aiWaitFor: The channels table is visible
        timeout: 10000
      - ai: In the "Agent Test Channel" row, click the delete icon button in the Actions column (tooltip "Delete")
      - sleep: 1000
      - ai: In the confirmation dialog, click the danger "Delete" button
      - aiWaitFor: The channels table no longer contains "Agent Test Channel"
        timeout: 15000

  - name: Delete the prerequisite downloader
    flow:
      - ai: Click "Downloaders" in the left sidebar
      - aiWaitFor: The downloaders table is visible
        timeout: 10000
      - ai: In the "Agent Test Downloader" row, click the delete icon button in the Actions column (tooltip "Delete")
      - sleep: 1000
      - ai: In the confirmation dialog, click the danger "Delete" button
      - aiWaitFor: The downloaders table no longer contains "Agent Test Downloader"
        timeout: 15000
