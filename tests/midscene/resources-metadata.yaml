# RSSRipple Resources & Metadata — resource browsing, drawer, metadata correction
# Self-contained: creates a channel from a live feed, fetches it, then exercises
# the Parsed/Unparsed tabs, the resource detail drawer and the metadata
# correction modal. Metadata search uses the server's configured data sources;
# assertions tolerate a no-results / error state when no source is configured.

web:
  url: ${RSSRIPPLE_URL:-http://localhost:9001}

agent:
  testId: resource-metadata
  groupName: RSSRipple E2E
  groupDescription: Resource browsing and metadata management flows

tasks:
  - name: Switch UI language to English
    flow:
      - ai: Click the "语言" (Language) dropdown at the very bottom of the left sidebar
      - sleep: 500
      - ai: Select "English" from the language dropdown options
      - aiWaitFor: The left sidebar menu shows English labels such as "Dashboard" and "Channels"
        timeout: 10000

  # ── Setup: channel with fetched resources ───────────────────────
  - name: Create a channel from a live feed
    flow:
      - ai: Click "Channels" in the left sidebar
      - aiWaitFor: The Channels page loads
        timeout: 10000
      - ai: Click the "New Channel" primary button
      - aiWaitFor: The "New Channel" form loads
        timeout: 10000
      - aiInput: The "Name" input field in the channel form
        value: Resource Test Channel
      - aiInput: The "RSS URL" input field
        value: ${RSSRIPPLE_TEST_FEED_URL:-https://rss.art19.com/apology-line}
      - ai: Click the "Validate" button attached to the RSS URL field
      - aiWaitFor: A green "Valid RSS" validation result appears below the RSS URL field
        timeout: 30000
      - ai: Click the "Create Channel" primary submit button
      - aiWaitFor: The Channels list page shows a row named "Resource Test Channel"
        timeout: 15000

  - name: Open the channel and fetch resources
    flow:
      - ai: In the channels table, click the "Resource Test Channel" name link
      - aiWaitFor: The channel detail page loads
        timeout: 10000
      - ai: Click the "Fetch Now" button at the top of the page
      - aiWaitFor: A success toast saying the channel was updated appears, or the button finishes its fetching state
        timeout: 60000

  # ── Parsed / Unparsed tabs ──────────────────────────────────────
  - name: Verify Parsed tab structure
    flow:
      - ai: Click the "Parsed" tab
      - sleep: 2000
      - aiAssert: The Parsed tab shows collapsible work groups with resource tables (columns like Ep, Resolution, Video, Audio, Container, Subs, Group, Published), or an empty state saying there are no resources yet

  - name: Verify Unparsed tab structure
    flow:
      - ai: Click the "Unparsed" tab
      - sleep: 2000
      - aiAssert: The Unparsed tab shows an "Unidentified Resources" card with a table of raw titles, or an empty state

  # ── Resource detail drawer ──────────────────────────────────────
  - name: Open a resource detail drawer
    flow:
      - ai: If any resource row is visible in the current tab, click the first resource row to open its detail drawer; if there are no resources at all, switch back to the Parsed tab and continue
      - sleep: 2000
      - aiAssert: Either a right-side detail drawer is open showing the resource title and parsed fields (Group, Episode, Resolution, Source, Video Codec, File Size, Published, Download Link), or the channel genuinely has no resources and an empty state is shown

  - name: Verify drawer metadata section
    flow:
      - aiAssert: If the drawer is open, it has a "Metadata" section showing either a linked work card or a "Not yet linked to metadata" placeholder with a "Manual Fix" button; otherwise the empty resources state is visible

  # ── Metadata correction modal ───────────────────────────────────
  - name: Open metadata correction modal
    flow:
      - ai: If the drawer is open, click the "Correct Metadata" primary button at the top right of the drawer; if no drawer is open, continue without action
      - sleep: 2000
      - aiAssert: Either a "Correct Metadata" modal is open with a search input, a content-type selector (TV Series / Movie) and a "Search" button, or there was no resource to correct

  - name: Run a metadata search
    flow:
      - ai: If the "Correct Metadata" modal is open, click its "Search" primary button (keep the pre-filled search text)
      - sleep: 8000
      - aiAssert: If the modal is open, it now shows metadata candidate cards each with a "Confirm Selection" button, or a clear no-results / error message

  - name: Close modal and drawer
    flow:
      - ai: If the "Correct Metadata" modal is open, close it via its X button or the Cancel control
      - sleep: 1000
      - ai: If the resource detail drawer is open, close it via its X button
      - sleep: 1000
      - aiAssert: The channel detail page is visible with no modal or drawer left open

  # ── Cleanup ─────────────────────────────────────────────────────
  - name: Delete the test channel
    flow:
      - ai: Click "Channels" in the left sidebar
      - aiWaitFor: The channels table is visible
        timeout: 10000
      - ai: In the "Resource Test Channel" row, click the delete icon button in the Actions column (tooltip "Delete")
      - sleep: 1000
      - ai: In the confirmation dialog, click the danger "Delete" button
      - aiWaitFor: The channels table no longer contains "Resource Test Channel"
        timeout: 15000
