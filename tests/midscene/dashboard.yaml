# RSSRipple Dashboard — Core overview tests
# Validates dashboard stats, active downloads, pending decisions, sidebar navigation
# (including the newer Repository / Settings pages) and sidebar collapse.
#
# UI note: the app defaults to zh-CN; every suite first switches the sidebar
# language to English so the prompts below can rely on English labels.

web:
  url: ${RSSRIPPLE_URL:-http://localhost:9001}

agent:
  testId: dashboard-smoke
  groupName: RSSRipple E2E
  groupDescription: Dashboard overview and navigation smoke tests

tasks:
  - name: Switch UI language to English
    flow:
      - ai: Click the "语言" (Language) dropdown at the very bottom of the left sidebar
      - sleep: 500
      - ai: Select "English" from the language dropdown options
      - aiWaitFor: The left sidebar menu shows English labels such as "Dashboard" and "Channels"
        timeout: 10000

  - name: Dashboard page loads with key statistics
    flow:
      - ai: Click "Dashboard" in the left sidebar
      - aiWaitFor: 'The page heading is "Dashboard" and statistics cards are visible: "Active Agents", "Active Channels", "Downloading" and "Pending Decisions"'
        timeout: 15000

  - name: Dashboard quick actions are visible
    flow:
      - aiAssert: The top-right of the Dashboard has an "Add Channel" button and an "Add Agent" button

  - name: Dashboard shows download agents section
    flow:
      - aiAssert: The page displays a "Download Agents" section below the statistics cards with up to 4 active agent cards (each about half the section width, agent name links to the agent detail page, showing channel, subscribed works or "Channel-wide", and condition tags), followed by an "In-progress Downloads" list with progress bars, or a "No in-progress downloads" fallback text

  - name: Dashboard shows active downloads section
    flow:
      - aiAssert: The page displays an "Active Downloads" card listing ongoing download groups with posters and progress bars, or an empty state saying there are no active downloads

  - name: Dashboard shows pending decisions section
    flow:
      - ai: Scroll down to view the bottom of the page
      - aiAssert: If decisions are pending, the page has a "Pending Decisions" card with a warning-orange border and title showing decision cards with candidate resources and Confirm/Skip actions; if nothing is pending, there is NO Pending Decisions card and instead a "No pending decisions" hint text appears directly under the statistics cards

  - name: Navigate to Repository via sidebar
    flow:
      - ai: Click the "Repository" menu item in the left sidebar
      - aiWaitFor: The Repository page loads with a works table and a segmented filter control (All / TV Series / Movies / Audio)
        timeout: 10000

  - name: Navigate to Channels via sidebar
    flow:
      - ai: Click the "Channels" menu item in the left sidebar
      - aiWaitFor: The Channels page shows a table with columns Name, Status, Fetch Interval, Metadata, Last Fetch
        timeout: 10000

  - name: Navigate to Download Agents via sidebar
    flow:
      - ai: Click the "Download Agents" menu item in the left sidebar
      - aiWaitFor: The agents page shows a table with columns Name, Channel, Downloader, Status, Scope, Conflict, LLM, Last Run
        timeout: 10000

  - name: Navigate to Downloaders via sidebar
    flow:
      - ai: Click the "Downloaders" menu item in the left sidebar
      - aiWaitFor: The downloaders page shows a table with columns Name, Type, URL, Default Download Directory, Status, Last Check
        timeout: 10000

  - name: Navigate to Settings via sidebar
    flow:
      - ai: Click the "Settings" menu item in the left sidebar
      - aiWaitFor: The System Settings page loads with an "LLM API" card and an "External Search Data Sources" card
        timeout: 10000

  - name: Return to Dashboard
    flow:
      - ai: Click the "Dashboard" menu item in the left sidebar
      - aiWaitFor: The Dashboard page loads again with the statistics cards visible
        timeout: 10000

  - name: Sidebar collapse and expand
    flow:
      - ai: Click the collapse-sidebar icon button at the very bottom of the left sidebar (tooltip "Collapse sidebar")
      - sleep: 1000
      - aiAssert: The sidebar is collapsed and shows only icons without menu text labels
      - ai: Click the expand-sidebar icon button at the bottom of the collapsed sidebar (tooltip "Expand sidebar")
      - sleep: 1000
      - aiAssert: The sidebar is expanded again showing full menu labels (Dashboard, Repository, Channels, Download Agents, Downloaders, Settings)
