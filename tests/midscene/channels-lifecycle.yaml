# RSSRipple Channel Lifecycle — Full CRUD + operations
# Covers: create channel (with URL validation + feed preview), list/detail, manual fetch,
# edit, delete. The create form pre-fills a default field mapping, so creation does NOT
# require the AI field-mapping analysis (which would need a configured LLM).

web:
  url: ${RSSRIPPLE_URL:-http://localhost:9001}

agent:
  testId: channel-lifecycle
  groupName: RSSRipple E2E
  groupDescription: Complete channel management lifecycle tests

tasks:
  - name: Switch UI language to English
    flow:
      - ai: Click the "语言" (Language) dropdown at the very bottom of the left sidebar
      - sleep: 500
      - ai: Select "English" from the language dropdown options
      - aiWaitFor: The left sidebar menu shows English labels such as "Dashboard" and "Channels"
        timeout: 10000

  # ── Create Channel ───────────────────────────────────────────────
  - name: Open new channel form
    flow:
      - ai: Click "Channels" in the left sidebar
      - aiWaitFor: The Channels page loads with a table listing RSS channels
        timeout: 10000
      - ai: Click the "New Channel" primary button at the top right
      - aiWaitFor: The "New Channel" form loads with fields for Name, RSS URL, Fetch Interval and a Field Mapping JSON textarea that is pre-filled
        timeout: 10000

  - name: Fill channel name
    flow:
      - aiInput: The "Name" input field in the channel form
        value: Test RSS Feed
      - sleep: 500

  - name: Validate RSS URL
    flow:
      - aiInput: The "RSS URL" input field
        value: ${RSSRIPPLE_TEST_FEED_URL:-https://rss.art19.com/apology-line}
      - sleep: 500
      - ai: Click the "Validate" button attached to the right of the RSS URL field
      - aiWaitFor: A green validation result appears below the RSS URL field, starting with "Valid RSS" and showing entry counts
        timeout: 30000

  - name: Preview RSS feed
    flow:
      - ai: Click the "Preview" small button in the Field Mapping section
      - aiWaitFor: The right-hand Preview panel lists feed entries with parsed-field tags
        timeout: 15000

  - name: Submit the channel form
    flow:
      - ai: Click the "Create Channel" primary submit button at the bottom of the form
      - aiWaitFor: The Channels list page is shown again and the table contains a row named "Test RSS Feed"
        timeout: 15000
      - aiAssert: The "Test RSS Feed" row has a status badge in the Status column

  # ── View Channel Detail ─────────────────────────────────────────
  - name: Open channel detail page
    flow:
      - ai: In the channels table, click the "Test RSS Feed" channel name link
      - aiWaitFor: The channel detail page loads showing the channel name, its RSS URL, "Fetch Now" and "Edit" buttons, and tabs labeled "Parsed" and "Unparsed"
        timeout: 10000
      - aiAssert: The page heading shows "Test RSS Feed"

  - name: Manual fetch
    flow:
      - ai: Click the "Fetch Now" button at the top of the channel detail page
      - aiWaitFor: A success toast saying the channel was updated appears, or the button shows a fetching state and then completes
        timeout: 60000

  - name: View resources tabs
    flow:
      - aiAssert: The channel detail page shows "Parsed" and "Unparsed" tabs; the Parsed tab shows resource groups or an empty state prompting to fetch from RSS

  # ── Edit Channel ────────────────────────────────────────────────
  - name: Navigate to edit channel
    flow:
      - ai: Click the "Edit" button at the top right of the channel detail page
      - aiWaitFor: The "Edit Channel" form loads with the name field pre-filled with "Test RSS Feed"
        timeout: 10000

  - name: Update channel name
    flow:
      - ai: Clear the Name input field
      - aiInput: The "Name" input field in the channel form
        value: Test RSS Feed Updated
      - sleep: 500
      - ai: Click the "Save Changes" primary button at the bottom of the form
      - aiWaitFor: The channel detail page is shown again with the heading "Test RSS Feed Updated"
        timeout: 15000

  # ── Delete Channel ──────────────────────────────────────────────
  - name: Delete the test channel
    flow:
      - ai: Click "Channels" in the left sidebar
      - aiWaitFor: The channels list table is visible with the "Test RSS Feed Updated" row
        timeout: 10000
      - ai: In the "Test RSS Feed Updated" row, click the delete icon button in the Actions column (tooltip "Delete")
      - sleep: 1000
      - ai: In the confirmation dialog titled "Delete this channel?", click the danger "Delete" button
      - aiWaitFor: A toast says the channel was deleted and the channels table no longer contains "Test RSS Feed Updated"
        timeout: 15000
