[project]
name = "rssripple"
version = "0.1.0"
description = "Automated RSS subscription downloader with intelligent filtering and LLM-assisted decisions"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy[asyncio]>=2.0.45,<2.1",
    "pydantic>=2.11.2",
    "pydantic-settings>=2.5.2",
    "httpx>=0.28.1",
    "feedparser==6.0.11",
    "transmission-rpc==7.0.6",
    "apscheduler==3.10.4",
    "openai>=1.52.0,<2",
    "python-dotenv==1.0.1",
    "opencc-python-reimplemented>=0.1.7",
    "openrouter>=0.10.0",
    "redis>=5.0",
    # Optional database drivers (auto-selected via DATABASE_URL scheme)
    "asyncpg>=0.30.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "Wikipedia-API>=0.15.0",
    "pyarrow>=17.0.0",
    "jinja2>=3.1.0",
    "pyturso==0.8.0rc2",
    "pyotp>=2.9.0",
    "bencodepy>=0.9.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "fakeredis>=2.0",
    "pytest-cov>=7.1.0",
    "mutmut>=3.7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "timeout: mark a test with a timeout (seconds)",
    "integration: mark a test as an integration test",
    "asyncio: mark a test as an asyncio test",
]

# Mutation testing (mutmut) — Phase 1 scope: the deterministic leaf modules
# that have fast, dedicated unit tests. Expand ``only_mutate`` incrementally
# toward the service layer as the mutation suite stabilizes.
[tool.mutmut]
source_paths = ["app"]
pytest_add_cli_args_test_selection = ["tests/unit"]
# Some unit tests import backfill scripts (scripts/*) — copy them alongside
# the tests, plus the coverage config used by ``mutate_only_covered_lines``.
also_copy = ["scripts", ".coveragerc"]
only_mutate = [
    "app/services/text_normalizer.py",
    "app/services/url_tools.py",
    "app/services/anime_signals.py",
    "app/services/wikipedia_episode_parser.py",
    "app/services/metadata_wiki_classify.py",
    "app/services/resource_parser.py",
    "app/services/filter_engine.py",
    "app/services/genre_registry.py",
    "app/utils/download_paths.py",
]
# ``mutate_only_covered_lines`` is intentionally left OFF: it relies on
# coverage.py resolving ``source = app`` against mutmut's ``mutants/app``
# copy, which does not match this repo's .coveragerc layout (resulting in an
# empty covered-line set). The scoped ``only_mutate`` leaf modules are small
# and well-tested, so full-line mutation stays fast and low-noise.
# Never mutate log statements / raise statements — message wording and
# exception types are not meaningful mutation targets.
do_not_mutate_patterns = [
    "logger\\.\\w+",
    "raise \\w+",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# Tests are intentionally looser than app/: allow compact fixtures,
# post-sys.path imports, long sample payloads, mock-class idioms.
"tests/**/*.py" = [
    "E501",  # long lines in fixtures / sample RSS/torrent payloads
    "E402",  # imports intentionally placed after sys.path / env setup
    "E702",  # compact fixture setup: `ch_id = _uuid(); rid = _uuid()`
    "N805",  # `self_inner` in nested `class _Ctx` async ctx-managers
    "N806",  # PascalCase mock-patch aliases (`MockCls`)
]
# LLM prompt templates hold few-shot example strings verbatim; line-length
# rewraps would corrupt the samples passed to the model.
"app/services/metadata_agent.py" = ["E501"]
"app/services/metadata_prompts.py" = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://pypi.org/simple/"
default = true
