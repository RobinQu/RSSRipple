# Eval service only — excluded from the default docker-compose.yml.
# Run with: docker compose -f docker-compose.eval.yml up -d
# Same compose project name as the default file, so it shares the
# rssripple_app-data volume with the app service.
services:
  eval:
    build: .
    ports:
      - "9002:9002"
    volumes:
      - app-data:/app/data
      - ./tests:/app/tests
    env_file: .env
    environment:
      # eval uses its own Turso file: a Turso database file is locked by a
      # single process, so app and eval cannot share one.
      - DATABASE_URL=sqlite+aioturso:///data/rss_ripple_eval_turso.db
      - LOG_LEVEL=DEBUG
    command: ["uv", "run", "--no-project", "uvicorn", "tests.integration.eval.main:app", "--host", "0.0.0.0", "--port", "9002", "--reload"]
    develop:
      watch:
        - action: sync
          path: ./tests/integration/eval
          target: /app/tests/integration/eval
          ignore:
            - __pycache__/
            - "*.pyc"
    restart: unless-stopped

volumes:
  app-data:
