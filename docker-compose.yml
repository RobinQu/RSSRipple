# Default stack: distributed (PostgreSQL + Redis) — 1 web + 3 workers.
# The web service serves HTTP and enqueues jobs (APP_ROLE=web); the worker
# replicas run the scheduler and consume the queue, with no HTTP listener
# (APP_ROLE=worker). Configure your own downloader (Transmission RPC) via the UI.
# The eval service lives in docker-compose.eval.yml and is started separately;
# the test stacks (docker-compose.test*.yml) bundle their own transmission.
#
# For a single-node, dependency-free deployment (embedded Turso DB + in-memory
# queue, no PostgreSQL/Redis services), use docker-compose.standalone.yml.
services:
  # ── PostgreSQL (shared database) ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-rssripple}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-rssripple}
      - POSTGRES_DB=${POSTGRES_DB:-rssripple}
    volumes:
      # Named volume for the PostgreSQL data directory — never put it on the
      # CIFS/SMB share below.
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rssripple} -d ${POSTGRES_DB:-rssripple}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Redis (shared task queue) ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    ports:
      - "9001:9001"
    volumes:
      # Named volume (not a bind mount) for posters + misc app data. The SQLite
      # DB on a bind mount hit recurring "disk I/O error" under concurrent
      # writes on Docker Desktop/macOS (virtiofs EIO); a named volume is backed
      # by the Linux VM's filesystem and avoids that. The database itself now
      # lives in the PostgreSQL service above; this volume only holds posters.
      - app-data:/app/data
      # 远程存储（逻辑卷挂载点，可选；不需要内置文件整理时可移除）。
      # SMB/CIFS 共享挂到容器 /storage/vault，运行时在「存储卷」页面建逻辑卷
      # 记录指向该路径，下载器/媒体服务器再按（逻辑卷 + 子路径）绑定。
      # 凭据走 .env 的 SMB_USER/SMB_PASSWORD/SMB_UID/SMB_GID。
      - vault-storage:/storage/vault
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-rssripple}:${POSTGRES_PASSWORD:-rssripple}@postgres:5432/${POSTGRES_DB:-rssripple}
      - QUEUE_BACKEND=redis
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=DEBUG
      - POSTER_CACHE_DIR=/app/data/posters
      # Pure web role: HTTP + enqueue only; scheduling/queue consumption
      # runs in the worker service below.
      - APP_ROLE=web
    command: ["uv", "run", "--no-project", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "9001", "--reload"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Webhook consumers running on the Docker host (e.g. vault-organizer):
    # the machine hostname resolves to loopback (127.0.1.1) and never works
    # across containers; this pins host.docker.internal to the host gateway.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    develop:
      watch:
        - action: sync
          path: ./app
          target: /app/app
          ignore:
            - __pycache__/
            - "*.pyc"
        - action: rebuild
          path: pyproject.toml
        - action: rebuild
          path: uv.lock
        - action: rebuild
          path: frontend
    restart: unless-stopped

  # ── Workers (scheduler + queue consumers, no HTTP) ────────────────────────
  # Scale with `deploy.replicas` (or `docker compose up --scale worker=N`).
  # No port mapping and no develop.watch sync: workers don't serve HTTP and
  # don't hot-reload.
  worker:
    build: .
    volumes:
      # Same volumes as web: posters/torrent cache (app-data) and the
      # logical-volume mount for organize file operations (vault-storage).
      - app-data:/app/data
      - vault-storage:/storage/vault
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-rssripple}:${POSTGRES_PASSWORD:-rssripple}@postgres:5432/${POSTGRES_DB:-rssripple}
      - QUEUE_BACKEND=redis
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=DEBUG
      - POSTER_CACHE_DIR=/app/data/posters
      - APP_ROLE=worker
    command: ["uv", "run", "--no-project", "python", "-m", "app.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Webhook deliveries run on the worker now (notify loop lives in the
    # scheduler); same host-gateway pin as web for host-side consumers.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    deploy:
      replicas: 3

volumes:
  app-data:
  postgres-data:
  vault-storage:
    driver: local
    driver_opts:
      type: cifs
      device: "//192.168.0.132/vault"
      o: "username=${SMB_USER},password=${SMB_PASSWORD},vers=3.0,iocharset=utf8,uid=${SMB_UID},gid=${SMB_GID},file_mode=0664,dir_mode=0775"
