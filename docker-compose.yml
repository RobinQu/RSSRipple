# Default stack: app only — configure your own downloader (Transmission RPC)
# via the UI. The eval service lives in docker-compose.eval.yml and is started
# separately; the test stacks (docker-compose.test*.yml) bundle their own
# transmission service.
services:
  app:
    build: .
    ports:
      - "9001:9001"
    volumes:
      # Named volume (not a bind mount) for the SQLite DB + posters. The DB on a
      # bind mount hit recurring "disk I/O error" under concurrent writes on
      # Docker Desktop/macOS (virtiofs EIO); a named volume is backed by the
      # Linux VM's filesystem and avoids that.
      - app-data:/app/data
      # 远程存储（逻辑卷挂载点，可选；不需要内置文件整理时可移除）。
      # SMB/CIFS 共享挂到容器 /storage/vault，运行时在「存储卷」页面建逻辑卷
      # 记录指向该路径，下载器/媒体服务器再按（逻辑卷 + 子路径）绑定。
      # 凭据走 .env 的 SMB_USER/SMB_PASSWORD/SMB_UID/SMB_GID。
      # 注意：应用数据（上面的 app-data）必须留在本地卷，**不要**放到这个
      # 网络共享上——SQLite/Turso 文件锁在网络文件系统不可靠。
      - vault-storage:/storage/vault
    env_file: .env
    environment:
      - DATABASE_URL=sqlite+aioturso:///data/rss_ripple_turso.db
      - LOG_LEVEL=DEBUG
      - POSTER_CACHE_DIR=/app/data/posters
    command: ["uv", "run", "--no-project", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "9001", "--reload"]
    # Webhook consumers running on the Docker host (e.g. vault-organizer):
    # the machine hostname resolves to loopback (127.0.1.1) and never works
    # across containers; this pins host.docker.internal to the host gateway.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    develop:
      watch:
        - action: sync
          path: ./app
          target: /app/app
          ignore:
            - __pycache__/
            - "*.pyc"
        - action: rebuild
          path: pyproject.toml
        - action: rebuild
          path: uv.lock
        - action: rebuild
          path: frontend
    restart: unless-stopped

volumes:
  app-data:
  vault-storage:
    driver: local
    driver_opts:
      type: cifs
      device: "//192.168.0.132/vault"
      o: "username=${SMB_USER},password=${SMB_PASSWORD},vers=3.0,iocharset=utf8,uid=${SMB_UID},gid=${SMB_GID},file_mode=0664,dir_mode=0775"
