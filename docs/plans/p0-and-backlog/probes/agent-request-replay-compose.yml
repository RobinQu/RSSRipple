services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: organize_test
      POSTGRES_PASSWORD: organize_test
      POSTGRES_DB: organize_test
    ports: ['127.0.0.1::5432']
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U organize_test -d organize_test']
      interval: 1s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1::6379']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 1s
      timeout: 3s
      retries: 30
