# Deliberately separate from the running application and its database volumes.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: corpus
      POSTGRES_PASSWORD: corpus
      POSTGRES_DB: metadata_corpus_test
    ports:
      - "127.0.0.1:55439:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corpus -d metadata_corpus_test"]
      interval: 2s
      timeout: 3s
      retries: 15
