name: CI Fast Gate

on:
  push:
    branches:
      - 'feature/**'
      - 'feat/**'
      - 'bugfix/**'
      - 'fix/**'
      - 'chore/**'
      - 'ai/**'
      - 'copilot/**'
      - 'cursor/**'
      - 'claude/**'
      - 'codex/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - 'feature/**'
      - 'feat/**'
      - 'bugfix/**'
      - 'fix/**'
      - 'chore/**'
      - 'ai/**'
      - 'copilot/**'
      - 'cursor/**'
      - 'claude/**'
      - 'codex/**'
      - 'hotfix/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run ruff
        run: uv run ruff check .

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Run unit and API tests
        run: uv run pytest tests/unit tests/api -v --tb=short --cov=app --cov-report=term --cov-fail-under=95

      - name: Offline production metadata acceptance
        env:
          CORPUS_REPORT_DIR: /tmp/metadata-corpus
        run: uv run pytest tests/integration/metadata_corpus -q --junitxml=/tmp/metadata-corpus/integration.xml

      - name: Upload corpus acceptance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-metadata-corpus
          path: /tmp/metadata-corpus/
