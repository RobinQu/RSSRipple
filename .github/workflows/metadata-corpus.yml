name: Metadata corpus

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  offline-reconstruction:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: corpus
          POSTGRES_PASSWORD: corpus
          POSTGRES_DB: metadata_corpus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U corpus -d metadata_corpus_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CORPUS_TEST_DATABASE_URL: postgresql+asyncpg://corpus:corpus@127.0.0.1:5432/metadata_corpus_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --all-groups
      - name: Corpus infrastructure and production scenarios (network replay only)
        run: uv run pytest tests/metadata_corpus -q --junitxml=/tmp/metadata-corpus.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metadata-corpus-results
          path: |
            /tmp/metadata-corpus.xml
            tests/fixtures/metadata_corpus_v1/audit.json
