name: Docker Publish

# Builds and publishes a multi-arch (amd64 + arm64) Docker image to ghcr.io
# in the repository's own namespace on every push to main and on version tags.
#
# Quality is split into independently rerunnable jobs (lint / unit+API /
# offline metadata corpus) so a failure is scoped to one concern. The image
# is only built when all three pass.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  # Retry a transient failure (registry EOF, flaky runner) without pushing an
  # empty commit.
  workflow_dispatch:

# A newer push to the same ref must win: cancel the older run instead of
# letting two multi-arch builds race to publish :latest.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Keep CI on the same interpreter as the published image (Dockerfile uses
  # python:3.12-slim). Pinning also avoids uv resolving a brand-new CPython
  # that libtorrent has no wheels for.
  PYTHON_VERSION: '3.12'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Run ruff
        run: uv run ruff check .

  unit-api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Run unit and API tests
        run: uv run pytest tests/unit tests/api -q --tb=short

  metadata-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Offline production metadata acceptance
        id: corpus
        env:
          CORPUS_REPORT_DIR: /tmp/metadata-corpus
        run: |
          mkdir -p /tmp/metadata-corpus
          uv run pytest tests/integration/metadata_corpus -q --junitxml=/tmp/metadata-corpus/integration.xml

      - name: Explain corpus replay failure
        if: steps.corpus.outcome == 'failure'
        run: |
          echo "::error title=Metadata corpus replay failed::A prompt/request fingerprint changed or recorded evidence was not fully consumed. Re-record and review the affected cassette (docs/testing/metadata-corpus.md); never weaken the replay."
          {
            echo "### Metadata corpus replay failed"
            echo ""
            echo "A prompt/request fingerprint changed, or recorded evidence was not fully consumed."
            echo "Re-record the affected scenario, review it, and commit the new cassette; see \`docs/testing/metadata-corpus.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload corpus acceptance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-metadata-corpus
          path: /tmp/metadata-corpus/

  build-and-push:
    needs: [lint, unit-api, metadata-corpus]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for non-native architectures)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action lowercases the image name, so RobinQu/RSSRipple
      # becomes ghcr.io/robinqu/rssripple (required by GHCR).
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            # main pushes -> :latest, :main, :sha-<short>
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short
            # version tags (v1.2.3) -> :1.2.3, :1.2, :1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
